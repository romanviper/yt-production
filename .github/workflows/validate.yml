name: Validate production system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Rematerialize P01 snapshot
        if: always()
        run: python scripts/materialize_sections.py products/sumer-writing --section P01
      - name: Upload rematerialized P01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-rematerialized
          path: |
            products/sumer-writing/03_sections/P01/section.json
            products/sumer-writing/03_sections/P01/brief.md
            products/sumer-writing/03_sections/P01/evidence-pack.json
            products/sumer-writing/03_sections/P01/historical-substrate.json
            products/sumer-writing/03_sections/P01/narration-pack.json
            products/sumer-writing/03_sections/P01/continuity-in.md
      - name: Enforce architecture boundary for every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/governance.py commit-range --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate products
        run: python scripts/validate.py products/*
