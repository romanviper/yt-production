name: Validate production system

on:
  pull_request:
  push:
    branches: [main, codex/p01-phase3-whitebox-mvp]

jobs:
  feedback-focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused feedback check
        run: |
          python -m unittest tests.test_learning_runtime tests.test_phase3_whitebox tests.test_feedback_integrity tests.test_feedback_loop tests.test_workspace -v && \
          python scripts/experiments/verify_phase1_benchmark.py && \
          python scripts/experiments/verify_phase1_guided_review.py --session benchmarks/p01/review-sessions/owner-pilot-01-guided.json && \
          python scripts/experiments/verify_phase1_guided_review.py --session benchmarks/p01/review-sessions/phase3-p3-f01-rerun-guided.json && \
          rm -rf /tmp/p01-feedback-case /tmp/p01-workspace-smoke && \
          python -m learning_runtime.feedback prepare p01-rootcause-01 --out /tmp/p01-feedback-case && \
          python -m learning_runtime.feedback verify --case-dir /tmp/p01-feedback-case && \
          python -m learning_runtime.workspace smoke --out /tmp/p01-workspace-smoke && \
          python - <<'PY'
          import json
          from pathlib import Path
          case = json.loads(Path('/tmp/p01-feedback-case/case.json').read_text(encoding='utf-8'))
          current = json.loads(Path('/tmp/p01-feedback-case/current.json').read_text(encoding='utf-8'))
          smoke = json.loads(Path('/tmp/p01-workspace-smoke/WORKSPACE-SMOKE-01/control/smoke-result.json').read_text(encoding='utf-8'))
          print(json.dumps({
              'case_id': case['case_id'],
              'brief_raw_sha256': case['standard']['brief']['identity']['raw_sha256'],
              'product_contract_raw_sha256': case['standard']['product_contract']['identity']['raw_sha256'],
              'target_profile_raw_sha256': case['standard']['target_profile']['identity']['raw_sha256'],
              'baseline_text_sha256': case['baseline']['identity']['text_sha256'],
              'candidate_text_sha256': case['candidate']['identity']['text_sha256'],
              'intervention_raw_sha256': case['intervention']['identity']['raw_sha256'],
              'measurement_status': current['status'],
              'mapping': case['trace']['mapping_status'],
              'suspected_regions': case['trace']['suspected_regions'],
              'attribution_confidence': case['trace']['attribution_confidence'],
              'workspace_smoke': smoke['status'],
              'workspace_denied': smoke['denied'],
              'workspace_handoff_result': smoke['handoff']['result'],
              'workspace_handoff_sha256': smoke['handoff']['source']['identity']['raw_sha256'],
              'workspace_host_process_isolation': smoke['manifest']['policy']['host_process_isolation'],
          }, ensure_ascii=False, indent=2))
          PY

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Enforce architecture boundary for every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/governance.py commit-range --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Validate products
        run: python scripts/validate.py products/*
