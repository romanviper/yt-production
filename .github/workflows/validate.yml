name: Validate production system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Enforce architecture boundary for head commit
        run: python scripts/governance.py commit-scope --base HEAD^
      - name: Validate products
        run: python scripts/validate.py products/*
